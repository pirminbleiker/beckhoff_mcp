name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). If the tag does not exist, it will be created from the current ref.'
        required: true
        default: 'v0.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $tag = '${{ github.event.inputs.tag }}'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'No tag resolved' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (Release, win-x64, single-file, self-contained)
        shell: pwsh
        working-directory: src/BeckhoffMcp.Server
        run: |
          dotnet publish -c Release -o publish
          if (-not (Test-Path 'publish/beckhoff-mcp.exe')) {
            throw 'beckhoff-mcp.exe not found in publish output'
          }
          $files = Get-ChildItem publish
          if ($files.Count -ne 1 -or $files[0].Name -ne 'beckhoff-mcp.exe') {
            throw "Expected a single exe in publish/, got: $($files | ForEach-Object Name -join ', ')"
          }

      - name: Stage release artefacts
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $exeName = "beckhoff-mcp-$tag-win-x64.exe"
          Copy-Item 'src/BeckhoffMcp.Server/publish/beckhoff-mcp.exe' $exeName
          (Get-FileHash $exeName -Algorithm SHA256).Hash | Out-File "$exeName.sha256"
          Get-ChildItem $exeName, "$exeName.sha256" | ForEach-Object { Write-Host "$($_.Name)  $($_.Length) bytes" }
          "exe=$exeName"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha=$exeName.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: stage

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.stage.outputs.exe }}
            ${{ steps.stage.outputs.sha }}
