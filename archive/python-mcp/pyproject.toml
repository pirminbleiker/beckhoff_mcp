[project]
name = "beckhoff_mcp"
version = "0.1.0"
description = "MCP server for Beckhoff PLC communication via ADS"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyads>=3.3.0",
    "pydantic>=2.0.0",
]

[project.scripts]
beckhoff_mcp = "beckhoff_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beckhoff_mcp"]
